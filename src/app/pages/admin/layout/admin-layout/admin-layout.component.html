<div class="workspace-shell">
  <sh-workspace-sidebar
    [open]="sidebarOpen"
    (closeSidebar)="closeSidebar()">
  </sh-workspace-sidebar>

  <button
    class="workspace-shell__backdrop"
    type="button"
    aria-label="Close workspace navigation"
    *ngIf="sidebarOpen"
    (click)="closeSidebar()">
  </button>

  <div class="workspace-shell__main">
    <sh-workspace-topbar
    [payload]="payload"
      (menuToggle)="toggleSidebar()"
      (logoutClick)="logout()">
    </sh-workspace-topbar>

    <main class="workspace-shell__content">
      <sh-workspace-breadcrumbs></sh-workspace-breadcrumbs>

      <section class="workspace-shell__page">
        <router-outlet></router-outlet>
      </section>
    </main>

    <sh-workspace-footer></sh-workspace-footer>
  </div>
</div>
