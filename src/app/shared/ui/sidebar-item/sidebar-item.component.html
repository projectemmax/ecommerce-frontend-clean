<a
  class="sh-sidebar-item"
  [class.sh-sidebar-item--disabled]="disabled"
  [routerLink]="disabled ? null : route"
  routerLinkActive="sh-sidebar-item--active"
  [routerLinkActiveOptions]="{ exact: exact }"
  ariaCurrentWhenActive="page"
  [attr.aria-disabled]="disabled">
  <span class="sh-sidebar-item__icon" aria-hidden="true">
    {{ icon || label.slice(0, 1) }}
  </span>
  <span class="sh-sidebar-item__label">{{ label }}</span>
</a>
