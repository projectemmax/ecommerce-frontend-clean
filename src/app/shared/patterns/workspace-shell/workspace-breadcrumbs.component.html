<nav class="workspace-breadcrumbs" aria-label="Workspace breadcrumbs" *ngIf="crumbs().length">
  <ol>
    <li *ngFor="let crumb of crumbs(); let last = last">
      <ng-container *ngIf="!last; else currentCrumb">
        <a [routerLink]="crumb.url">{{ crumb.label }}</a>
      </ng-container>

      <ng-template #currentCrumb>
        <span aria-current="page">{{ crumb.label }}</span>
      </ng-template>
    </li>
  </ol>
</nav>
