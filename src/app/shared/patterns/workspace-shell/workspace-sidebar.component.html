<aside class="workspace-sidebar" [class.workspace-sidebar--open]="open" aria-label="Workspace navigation">
  <div class="workspace-sidebar__header">
    <span>{{ roleLabel }}</span>
    <strong>Workspace</strong>
    <button type="button" aria-label="Close navigation" (click)="closeSidebar.emit()">Close</button>
  </div>

  <nav class="workspace-sidebar__nav" aria-label="Workspace Navigation">
    <section *ngFor="let group of visibleGroups">
      <h2>{{ group.title }}</h2>
      <ng-container *ngFor="let item of group.items">
        <sh-sidebar-item
          [label]="item.label"
          [route]="item.route"
          [icon]="item.icon"
          [exact]="item.exact || false"
          (click)="closeSidebar.emit()">
        </sh-sidebar-item>
      </ng-container>
    </section>
  </nav>
</aside>
