<aside class="workspace-sidebar" [class.workspace-sidebar--open]="open" aria-label="Workspace navigation">
  <div class="workspace-sidebar__header">
    <span>{{ roleLabel }}</span>
    <strong>Workspace</strong>
    <button type="button" aria-label="Close navigation" (click)="closeSidebar.emit()">Close</button>
  </div>

  <nav class="workspace-sidebar__nav">
    <section>
      <h2>Main</h2>
      <ng-container *ngFor="let item of mainItems">
        <sh-sidebar-item
          *ngIf="canShow(item)"
          [label]="item.label"
          [route]="item.route"
          [icon]="item.icon"
          [exact]="item.exact || false"
          (click)="closeSidebar.emit()">
        </sh-sidebar-item>
      </ng-container>
    </section>

    <section *ngIf="hasVisibleItems(adminItems)">
      <h2>Platform</h2>
      <ng-container *ngFor="let item of adminItems">
        <sh-sidebar-item
          *ngIf="canShow(item)"
          [label]="item.label"
          [route]="item.route"
          [icon]="item.icon"
          (click)="closeSidebar.emit()">
        </sh-sidebar-item>
      </ng-container>
    </section>

    <section *ngIf="hasVisibleItems(systemItems)">
      <h2>System</h2>
      <ng-container *ngFor="let item of systemItems">
        <sh-sidebar-item
          *ngIf="canShow(item)"
          [label]="item.label"
          [route]="item.route"
          [icon]="item.icon"
          (click)="closeSidebar.emit()">
        </sh-sidebar-item>
      </ng-container>
    </section>
  </nav>
</aside>
